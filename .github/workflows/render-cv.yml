name: Render CV

on:
  push:
    branches:
      - main
    paths:
      - 'resume.yaml'
      - '.github/workflows/render-cv.yml'

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate CV PDF
        run: |
          docker run --rm -v ${{ github.workspace }}:/data rendercv/rendercv render /data/resume.yaml

      - name: Upload PDF to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CV-PDF
          path: rendercv_output/*.pdf