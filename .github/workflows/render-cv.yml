name: Render CV

on:
  push:
    branches:
      - main
    paths:
      - 'resume.yaml'
      - '.github/workflows/render-cv.yml'

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate CV PDF
        run: |
          docker run --rm -v ${{ github.workspace }}:/work -u $(id -u):$(id -g) -e HOME=/tmp -w /work ghcr.io/rendercv/rendercv render resume.yaml

      - name: Upload PDF to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CV-PDF
          path: rendercv_output/*.pdf

      - name: Commit and push updated PDF
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Tilføj den nye PDF til Git
          git add rendercv_output/Julian_Askøe_Bluming_CV.pdf
          
          # Commit og push kun, hvis der rent faktisk er ændringer i PDF'en
          if git diff --staged --quiet; then
            echo "Ingen ændringer i PDF'en."
          else
            git commit -m "docs: opdateret Julian_Askøe_Bluming_CV.pdf [skip ci]"
            git push
          fi          