cv:
  name: Julian Askøe Bluming
  headline: Kandidatstuderende i Human Nutrition
  location: Tobakskollegiet, Søborg, København
  email: julian.askoe@gmail.com
  photo:
  phone:
  website:
  social_networks:
    - network: GitHub
      username: julianaskoe
  custom_connections:
  sections:
    Profil:
      - "Kandidatstuderende i Human Nutrition (MSc) ved Københavns Universitet (færdig august 2026) med professionsbachelor i Ernæring og Sundhed (Klinisk Diætetik). Stærk faglig og praktisk erfaring med ernæringsfysiologi, biokemi, kostvejledning og kostberegning."
      - "Har gennem studiet fået stor interesse for forskning og er motiveret af at kombinere den med klinisk praksis: at bidrage med ny viden og samtidig være i tæt kontakt med patienter og støtte dem gennem konkrete ernæringsindsatser."
      - "I mit kandidatspeciale planlagde og gennemførte jeg et klinisk studie af fosfor- og calciumbalance hos prædialysepatienter i stadie 4-5 med patientrekruttering, dataindsamling i REDCap og Sundhedsplatformen samt statistisk analyse i GraphPad Prism. Erfaring med forskning, systematisk dataindsamling og dokumentation."
      - "Særlig interesse for klinisk ernæring til komplekse patienter, herunder onkologi og patienter i risiko for underernæring, samt for nefrologi og endokrinologi. Arbejder struktureret, grundigt og selvstændigt."
      - "Erfaren med klinisk kostvejledning fra praktik på diætistlinjen: kostanamnese, patientsamtale og kostintervention efter NCP-modellen, samt måltidssammensætning til onkologi- og nyrepatienter. Erhverver kørekort, forventet klar november 2026."
      - "Detaljeorienteret og vedholdende – bliver ved, til opgaverne er løst. Trives i tværfaglige teams med både patientkontakt og projektarbejde. Møder patienter, pårørende og kolleger med engagement og nysgerrighed, og er fleksibel over for skiftende opgaver."
    education:
      - institution: Københavns Universitet
        area: Human Nutrition
        degree: MSc
        date:
        start_date: 2024-09
        end_date: 2026-08
        location:
        summary:
        highlights:
          - "Kandidatspeciale om sammenhængen mellem nyrefunktion og calcium-/fosfatbalance hos stadie 4-5 kronisk nyresyge patienter, samt sammenligning af calcium-, fosfor- og natriumindtag mellem vejet registrering og billedmetode (præcis titel følger). Udarbejdede forsøgsprotokol og registrerede forsøget på ClinicalTrials.gov. Rekrutterede 50 patienter, instruerede dem i kostregistrering via begge metoder og gennemførte opfølgende samtaler og vejledning mht. calcium og fosfor. Anvendte Sundhedsplatformen og registrerede data i VitaKost, REDCap og Excel, med statistisk analyse i GraphPad Prism. Forsøget skal publiceres efter forsvar."
      - institution: Københavns Professionshøjskole
        area: Ernæring og Sundhed (Klinisk Diætetik)
        degree: BAS
        date:
        start_date: 2021-02
        end_date: 2024-06
        location:
        summary:
        highlights:
          - "Bachelorprojekt: Indledende dataindsamling i forbindelse med et klinisk ernæringsforsøg om onkologipatienters ernæringsindtag efter cystektomi (Rigshospitalet, Ernæringsenheden). Bachelorprojektet omfattede opstartsfasen, da det fulde studieforløb strakte sig ud over bachelorprojektets tidsramme."
    Praktik:
      - company: Rigshospitalet Glostrup
        position: Klinisk praktik, ernæringsterapi til neurologiske patienter
        date:
        start_date: 2023-02
        end_date: 2023-03
        location:
        summary: "4 ugers klinisk praktik på neurologisk afdeling."
        highlights:
          - Deltog i og overværede opstart af ernæringsterapi samt diætetisk praksis over for neurologiske patienter (bl.a. tetraplegi og Parkinson), spiseforstyrrelser og diabetes.
      - company: Frederiksberg Hospital
        position: Klinisk praktik, hjerteafdelingen
        date:
        start_date: 2023-09
        end_date: 2023-10
        location:
        summary: "6 ugers klinisk praktik på hjerteafdelingen og reumatologisk forskningsenhed."
        highlights:
          - Vejledning i hjertesund/kolesterolsænkende kost til patienter med hyperkolesterolæmi samt højproteinkost til enkelte postoperative patienter.
          - Forestod selvstændig undervisning i vægttab for knæartrosepatienter i forbindelse med et forskningsprojekt (1 ugedag).
      - company: Rigshospitalet København
        position: Klinisk praktik, nefrologisk afdeling
        date:
        start_date: 2024-02
        end_date: 2024-04
        location:
        summary: "10 ugers klinisk praktik på nefrologisk afdeling."
        highlights:
          - Klinisk vejledning af prædialyse- og dialysepatienter inden for fosfat-, kalium- og proteinregulering.
          - Vejledning og håndtering af endokrinologiske tilstande (type 1/2-diabetes og pancreasresekerede patienter).
          - Løbende tværfaglig dialog og sparring med afdelingens læger og sygeplejersker.
    interesser:
      - bullet: Ernæring
      - bullet: Styrketræning
    Referencer:
      - "Mette Nielsen, klinisk diætist, Rigshospitalet – mette.nielsen@example.com, +45 12 34 56 78"
      - "Yderligere referencer udleveres på forespørgsel."
