        location:
        summary: "På 3. semester kom jeg i praktik i en børnehave. Her stod jeg i køkken i samarbejde med en køkkenchef. Opgaverne stod blandt andet på at bage brød, lave mad, skære frugt og grønt, tage opvaskeren, gøre rent, servere mad til børnene, vare indkøb og komme med en opskrift til et måltid. Det har givet mig utrolig meget at afprøve hvordan det er at være i et køkken, og jeg blev selv overrasket over hvor meget tid og planlægning det kræver at lave mad til så mange mennesker. Jeg fik også mærket hvordan det var at have et arbejde på fuld tid hvor man blev udfordret på mange forskellige områder. Jeg kan tage rigtig meget med fra praktikforløbet blandt andet er jeg blevet bedre til planlægning, spørge om hjælp når jeg har brug for hjælp, få et overblik over køkkenet, få mest ud af den tid man har når man er presset. Især det med at prøve selv at stå for et måltid, og en opskrift samt indkøb af vare gav mig rigtig meget og det føler jeg at jeg kan tage med til min kommende praktik, det at jeg er blevet mere selvstændig."
        highlights:
          - Lave mad
          - Forberedelse madlavning
          - Oprydning
          - Servering for børnene
      - company: Frederiksvej Børnehave
