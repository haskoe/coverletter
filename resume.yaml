      - "Kandidatstuderende i Human Nutrition (MSc) ved Københavns Universitet (færdig august 2026) med professionsbachelor i Ernæring og Sundhed (Klinisk Diætetik). Stærk faglig og praktisk erfaring med ernæringsfysiologi, biokemi, kostvejledning og kostberegning."
      - "Særlig interesse for nefrologi og endokrinologi og for diætprincipper til patienter med nyresygdomme. Min drøm er at diætvejlede patienter inden for nefrologien."
      - "Erfaren med klinisk kostvejledning fra praktik på diætistlinjen: kostanamnese, patientsamtale og kostintervention efter NCP-modellen, samt måltidssammensætning til nyre- og onkologipatienter. Til daglig styrketræner jeg og arbejder med egne kostplaner."
