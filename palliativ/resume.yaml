  sections:
    Profil:
      - "Autoriseret klinisk diötist med kandidatgrad i Human Ernèring. Motiveret for diötbehandling af indlagte og ambulante patienter, diabetesomrèdet og knoglesundheid."
      - "**Klinisk erfaring:** 20 ugers hospitalspraksis fordelt pø endokrinologi, nefrologi, kardiologi og neurologi — bède ambulant diötbehandling og Ernèringsbehandling af indlagte pø medicinske sengeafsnit. Herunder vejledning af patienter med type 1- og type 2-diabetes, pancreasresekerede samt komplekse nyrepatienter med samtidig diabetes. Fra mit kandidatspeciale flere månedlers erfaring med selvståndigt at varetage et deltagerforlåb: samtaler, opløring, opfølgning og telefonisk kontakt."
      - "**Formidling:** Individuel opløring og vejledning af patienter med vidt forskellige forudsätninger. Undervisningsgang for knäartrosepatienter samt fremläggelse til journal club for afdelingens läger."
      - "**IT og systematik:** Rutineret bruger af Sundhedsplatformen (selvståndigt udtrøk af lab-data og journaloplysninger) samt VitaKost og REDCap. Vant til at holde overblik over mange parallelle patientforlåb."
      - "**Personlige egenskaber:** Fagligt nrädet og udpräget detaljeorienteret, med stor vägt pø den individuelle tilgang til hver enkelt patient. Arbejder selvståndigt og driver gerne mine egne opgaver, men vèrdsètter faglig sparring højt og spørger gerne til råds. Fleksibel og vägter et godt arbejdsmiljø højt."
    education:
      - institution: Københavns Universitet
        area: Human Nutrition
        degree: MSc
        date:
        start_date: 2024-09
        end_date: 2026-08
        location:
        summary:
        highlights:
          - "**Kandidatspeciale** (nefrologisk Herlev Hospital): Klinisk tillègsstudie med kronisk nyresyge patienter (52 rekrutterede til studiet). To fokusomrèder: nyrefunktion og calcium-/fosfatbalance samt metodesammenligning af kostregistrering (vejet registrering vs. billedbaseret fotometode)."
          - "**Deltagerarbejde:** Afholdt samtaler med deltagerne efter lägens informationssamtale, indhentede samtykke og oplèrte dem i kostregistrering. Forestod modtagelse og gennemgang af registreringer samt telefonisk opfølgning ved spørgsmål eller afvigelser fra anbefalingerne."
          - "**Ansvar og samarbejde:** Udarbejdede protokol, deltagerinformation (godkendt af VEK) og diötetisk vejledningsmateriale. Drev kostregistreringsdelen i tèt koordination med forsøgsläge og afdelingens personale. Forbereder aktuelt publicering som førstforfatter."
          - "**Formidling:** Fremlagde til journal club for afdelingens läger."
          - "**Data:** Udtrøk af lab-data og journaler fra Sundhedsplatformen, databearbejdning i VitaKost og REDCap, statistisk analyse i GraphPad Prism."
          - "**Relevante kurser:** *Nutrition Related Diseases* og *Integrative Human Metabolism* (begge med fokus pø overvägt og diabetes); *Cellular and Integrative Physiology* (kardiovaskulär, respiratorisk og gastrointestinal fysiologi); *Study Design in Human Nutrition* – protokoludarbejdelse, statistisk analyse i R-studio og studiedesign; *Evidence, Diet and Health* – avanceret kritisk analyse af forskningslitteratur og studiedesigns. (Karakterudskrift vedhèftet)."
      - institution: Københavns Professionshøjskole
        area: Ernèring og Sundhed (Klinisk Diötetik)
        degree: BAS
        date:
        start_date: 2021-02
        end_date: 2024-06
        location:
        summary:
        highlights:
          - "**Bachelorprojekt** (Rigshospitalet, Ernèringsenheden): Systematisk dataindsamling i prospektivt, observationelt studie (n=25). Kortlägning af energi- og proteinindtag, däkningsgrad samt opfølgning pø vägtåndringer over 30 dages postoperativt forlåb — herunder journalopslag i Sundhedsplatformen."
          - "Undervisning i den motiverende samtale og sundhedsødagogisk formidling samt kritisk vurdering af kliniske studier."
    Praktik:
      - company: Bispebjerg og Frederiksberg Hospital
        position: Klinisk praktik, hjerteafdelingen
        date:
        start_date: 2023-09
        end_date: 2023-11
        location:
        summary: "6 ugers klinisk praktik pø hjerteafdelingen og reumatologisk forskningsenhed."
        highlights:
          - "Observerede undervisning og afholdt selv en undervisningsgang i forskningsprojekt om vägttab til knäartrosepatienter."
          - "Vejledning i hjertesund og kolesterolsänkende kost samt højproteinkost til postoperative patienter efter CABG."
      - company: Rigshospitalet København
        position: Klinisk praktik, nefrologisk afdeling
        date:
        start_date: 2023-11
        end_date: 2024-01
        location:
        summary: "10 ugers klinisk praktik."
        highlights:
          - "1 ugedag tilknyttet endokrinologisk afdeling: vejledning af patienter med type 1- og type 2-diabetes samt pancreasresekerede."
          - "Vejledning af dialyse- og prädialysepatienter, herunder flere med samtidig type 2-diabetes, hvor flere ernèringsmåssige hensyn skal afvejes i en praktisk gennemførlige kostplan."
          - "Løbende tvärfaglig dialog med afdelingens läger og sygeplejersker."
      - company: Rigshospitalet Glostrup
